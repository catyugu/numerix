name: CI

on:
  push:
    branches: [main, agent/dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.toolchain }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        toolchain: [GCC, Clang, AppleClang, MSVC]
        include:
          - os: ubuntu-latest
            toolchain: GCC
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            toolchain: Clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            toolchain: AppleClang
            cc: clang
            cxx: clang++
          - os: windows-latest
            toolchain: MSVC
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake==3.26.4 ninja
      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build, test, install and embed
        run: python ci/run_checks.py --config ${{ matrix.config }} --generator "Ninja Multi-Config" --build-root "${{ runner.temp }}/n"
